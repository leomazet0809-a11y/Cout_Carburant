<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coût carburant</title>
<meta name="theme-color" content="#FAFAFA">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('cout-carburant:theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAFA;
    --surface: #FFFFFF;
    --line: #E4E4E7;
    --ink: #18181B;
    --muted: #71717A;
    --faint: #A1A1AA;
    --accent: #2563EB;
    --error: #DC2626;
    --ring: rgba(37, 99, 235, 0.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B0B0E;
      --surface: #151519;
      --line: #27272A;
      --ink: #F4F4F5;
      --muted: #A1A1AA;
      --faint: #52525B;
      --accent: #7AA2FF;
      --error: #F87171;
      --ring: rgba(122, 162, 255, 0.22);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B0B0E;
    --surface: #151519;
    --line: #27272A;
    --ink: #F4F4F5;
    --muted: #A1A1AA;
    --faint: #52525B;
    --accent: #7AA2FF;
    --error: #F87171;
    --ring: rgba(122, 162, 255, 0.22);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum" 1, "cv11" 1;
    transition: background-color .2s ease, color .2s ease;
  }

  .app {
    max-width: 30rem;
    margin: 0 auto;
    padding:
      calc(env(safe-area-inset-top, 0px) + 1rem)
      max(1rem, env(safe-area-inset-right, 0px))
      calc(env(safe-area-inset-bottom, 0px) + 2rem)
      max(1rem, env(safe-area-inset-left, 0px));
  }

  /* En-tête */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: clamp(1.5rem, 6vw, 2.5rem);
  }
  h1 {
    margin: 0;
    font-size: 1.0625rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .theme-btn {
    display: inline-grid;
    place-items: center;
    width: 2.5rem;
    height: 2.5rem;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: border-color .15s ease, background-color .2s ease;
  }
  .theme-btn:hover { border-color: var(--faint); }
  .theme-btn:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--ring); border-color: var(--accent); }
  .theme-btn svg { width: 1.125rem; height: 1.125rem; }
  .theme-btn .i-sun { display: none; }
  :root[data-theme="dark"] .theme-btn .i-sun { display: block; }
  :root[data-theme="dark"] .theme-btn .i-moon { display: none; }

  /* Calcul */
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    transition: background-color .2s ease, border-color .2s ease;
  }
  .row {
    display: block;
    padding: 1.1rem 1.25rem 1.2rem;
    cursor: text;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .label {
    display: block;
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--muted);
    transition: color .15s ease;
  }
  .row:focus-within .label { color: var(--accent); }
  .entry { display: flex; align-items: baseline; gap: 0.5rem; }
  input {
    flex: 1;
    min-width: 0;
    width: 100%;
    border: 0;
    padding: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-weight: 600;
    letter-spacing: -0.03em;
    caret-color: var(--accent);
  }
  input:focus { outline: none; }
  input::placeholder { color: var(--faint); }
  .row input { font-size: clamp(2.25rem, 10vw, 3rem); line-height: 1.15; }
  .unit { color: var(--muted); font-weight: 500; white-space: nowrap; }
  .row .unit { font-size: 1.125rem; }
  .row.is-computed input { color: var(--accent); }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin: 1rem 0 0;
    padding: 0 0.25rem;
  }
  .stats div { min-width: 0; }
  .stats dt { font-size: 0.8125rem; color: var(--muted); }
  .stats dd { margin: 0.1rem 0 0; font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.01em; }

  .msg { margin: 0.75rem 0 0; padding: 0 0.25rem; font-size: 0.875rem; color: var(--error); }
  .msg[hidden] { display: none; }

  /* Paramètres */
  .params { margin-top: clamp(2rem, 7vw, 2.75rem); }
  h2 {
    margin: 0 0 0.75rem;
    padding: 0 0.25rem;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .params-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
    gap: 0.75rem;
  }
  .field {
    display: block;
    padding: 0.7rem 0.9rem 0.75rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    cursor: text;
    transition: border-color .15s ease, box-shadow .15s ease, background-color .2s ease;
  }
  .field:hover { border-color: var(--faint); }
  .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
  .field .label { font-size: 0.75rem; }
  .field input { font-size: 1.25rem; line-height: 1.3; letter-spacing: -0.02em; }
  .field .unit { font-size: 0.875rem; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Coût carburant</h1>
    <button class="theme-btn" id="theme" type="button" aria-label="Activer le mode sombre">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </header>

  <main>
    <section aria-label="Calcul">
      <div class="panel">
        <label class="row" data-key="km">
          <span class="label">Distance</span>
          <span class="entry">
            <input id="km" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" enterkeyhint="done" placeholder="0">
            <span class="unit">km</span>
          </span>
        </label>
        <label class="row" data-key="cost">
          <span class="label">Montant</span>
          <span class="entry">
            <input id="cost" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" enterkeyhint="done" placeholder="0">
            <span class="unit">€</span>
          </span>
        </label>
      </div>
      <dl class="stats">
        <div><dt>Volume</dt><dd id="liters">—</dd></div>
        <div><dt>Coût au km</dt><dd id="perkm">—</dd></div>
      </dl>
      <p class="msg" id="msg" role="alert" hidden></p>
    </section>

    <section class="params" aria-labelledby="params-title">
      <h2 id="params-title">Paramètres</h2>
      <div class="params-grid">
        <label class="field">
          <span class="label">Consommation moyenne</span>
          <span class="entry">
            <input id="conso" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" enterkeyhint="done">
            <span class="unit">L/100 km</span>
          </span>
        </label>
        <label class="field">
          <span class="label">Prix du litre</span>
          <span class="entry">
            <input id="prix" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" enterkeyhint="done">
            <span class="unit">€/L</span>
          </span>
        </label>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;

  /* Thème clair / sombre */
  var THEME_KEY = 'cout-carburant:theme';
  var themeBtn = $('theme');
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    themeBtn.setAttribute('aria-label', t === 'dark' ? 'Activer le mode clair' : 'Activer le mode sombre');
    themeMeta.setAttribute('content', t === 'dark' ? '#0B0B0E' : '#FAFAFA');
  }
  applyTheme(root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
  themeBtn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });

  /* Calcul */
  var trip = { km: $('km'), cost: $('cost') };
  var conso = $('conso'), prix = $('prix');
  var liters = $('liters'), perkm = $('perkm'), msg = $('msg');
  var KEY = 'cout-carburant:params';
  var DEFAULTS = { conso: '4,3', prix: '2,40', km: '90' };
  var source = 'km';

  function parse(s) {
    var t = String(s).replace(/[\s  ]/g, '').replace(',', '.');
    if (t === '') return null;
    var n = Number(t);
    return isFinite(n) ? n : NaN;
  }
  function fmt(n, max, min) {
    return n.toLocaleString('fr-FR', { minimumFractionDigits: min, maximumFractionDigits: max, useGrouping: false });
  }
  function other() { return source === 'km' ? 'cost' : 'km'; }
  function showMsg(text) {
    msg.textContent = text || '';
    msg.hidden = !text;
  }
  function reset() {
    trip[other()].value = '';
    liters.textContent = '—';
  }

  function update() {
    document.querySelectorAll('.row[data-key]').forEach(function (f) {
      f.classList.toggle('is-computed', f.dataset.key !== source);
    });
    var c = parse(conso.value), p = parse(prix.value);
    if (!(c > 0) || !(p > 0)) {
      perkm.textContent = '—';
      reset();
      showMsg('Renseignez une consommation et un prix du litre supérieurs à zéro.');
      return;
    }
    var lPerKm = c / 100;
    var ePerKm = lPerKm * p;
    perkm.textContent = fmt(ePerKm, 3, 3) + ' €';

    var v = parse(trip[source].value);
    if (v === null) { reset(); showMsg(''); return; }
    if (isNaN(v) || v < 0) {
      reset();
      showMsg('Saisissez un nombre positif, par exemple 90 ou 12,50.');
      return;
    }
    showMsg('');
    var km = source === 'km' ? v : v / ePerKm;
    if (source === 'km') trip.cost.value = fmt(km * ePerKm, 2, 2);
    else trip.km.value = fmt(km, 1, 0);
    liters.textContent = fmt(km * lPerKm, 2, 2) + ' L';
  }

  function saveParams() {
    try { localStorage.setItem(KEY, JSON.stringify({ conso: conso.value, prix: prix.value })); } catch (e) {}
  }
  function loadParams() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
    conso.value = saved && typeof saved.conso === 'string' ? saved.conso : DEFAULTS.conso;
    prix.value = saved && typeof saved.prix === 'string' ? saved.prix : DEFAULTS.prix;
  }
  function selectOnFocus(el) {
    el.addEventListener('focus', function () { setTimeout(function () { try { el.select(); } catch (e) {} }, 0); });
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter') el.blur(); });
  }

  Object.keys(trip).forEach(function (k) {
    trip[k].addEventListener('input', function () { source = k; update(); });
    selectOnFocus(trip[k]);
  });
  [conso, prix].forEach(function (el) {
    el.addEventListener('input', function () { saveParams(); update(); });
    selectOnFocus(el);
  });

  loadParams();
  trip.km.value = DEFAULTS.km;
  update();
})();
</script>
</body>
</html>
